[tox]
envlist = quality
requires = tox-uv>=1

[flake8]
max-line-length = 127
max-complexity = 10
show-source = true
count = true
statistics = true

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    flake8 src/crowdsourcehinter/

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands = pytest {posargs}
