name: Semantic Release

on:
  push:
    branches: [master]

jobs:
  run_tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  release:
    needs: run_tests
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    - run: git reset --hard ${{ github.sha }}
    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        git_committer_name: "github-actions"
        git_committer_email: "github-actions@github.com"
        changelog: "false"
        vcs_release: "false"
    - name: Create GitHub Release with Assets
      if: steps.release.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release_notes.md"
        gh release create "$TAG" \
          --verify-tag \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/release_notes.md" \
          dist/*
    - name: Upload dist
      if: steps.release.outputs.released == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      release_notes: ${{ steps.release.outputs.release_notes }}

  publish_to_pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
